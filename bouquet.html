<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bouquet</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Quicksand", Georgia, serif;
                color: #fff;
                text-align: center;
                background: linear-gradient(160deg, #7a1f2b 0%, #54101a 50%, #33060d 100%);
                min-height: 100vh;
                padding: 60px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
                overflow-x: hidden;
            }

body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: none;
                pointer-events: none;
                z-index: 0;
            }

            main {
                position: relative;
                z-index: 1;
                max-width: 620px;
            }

            .title {
                font-family: "Great Vibes", Georgia, serif;
                font-weight: 400;
                font-size: clamp(2.4rem, 8vw, 3.6rem);
                color: #fff;
                text-shadow: 0 1px 8px rgba(255, 255, 255, .8);
                margin-bottom: 10px;
                opacity: 0;
                animation: fadeIn 1s ease forwards .4s;
            }

            .sub {
                font-family: "Poppins", sans-serif;
                font-weight: 500;
                font-size: .95rem;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: #fff;
                opacity: 0;
                animation: fadeIn 1s ease forwards .7s;
            }

            .bouquet-img {
                display: block;
                width: min(420px, 88vw);
                height: auto;
                margin: 30px auto 0;
                user-select: none;
                cursor: pointer;
                animation: popIn .8s cubic-bezier(.22, 1.61, .36, 1) both .9s;
            }

            @keyframes popIn {
                0% { opacity: 0; transform: scale(.3); }
                70% { transform: scale(1.06); }
                100% { opacity: 1; transform: scale(1); }
            }

            .note {
                font-family: inherit;
                font-size: clamp(1.05rem, 3.5vw, 1.3rem);
                color: #fff;
                line-height: 1.7;
                max-width: 520px;
                margin-top: 24px;
                opacity: 0;
                animation: fadeIn 1s ease forwards 1.2s;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(18px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            .back {
                display: inline-block;
                margin-top: 40px;
                font-family: "Poppins", sans-serif;
                font-weight: 500;
                font-size: .85rem;
                letter-spacing: 2px;
                text-transform: uppercase;
                text-decoration: none;
                color: #fff;
                border: 2px solid rgba(192, 90, 124, .45);
                padding: 12px 28px;
                border-radius: 40px;
                transition: background .25s ease, transform .2s ease;
                opacity: 0;
                animation: fadeIn 1s ease forwards 1.5s;
            }

            .back:hover {
                background: rgba(232, 129, 154, .18);
                transform: scale(1.06);
            }

            .music-player {
                position: fixed;
                right: 20px;
                bottom: 24px;
                z-index: 60;
                display: flex;
                align-items: center;
                gap: 12px;
                background: rgba(255, 250, 252, .9);
                border-radius: 40px;
                padding: 8px 16px 8px 8px;
                box-shadow: 0 10px 26px rgba(192, 90, 124, .35);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
            }

            .playing-text {
                font-family: "Poppins", sans-serif;
                font-weight: 400;
                font-size: .68rem;
                letter-spacing: 2px;
text-transform: uppercase;
                color: #000;
                white-space: nowrap;
                margin: 0;
            }

            .play-btn {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: #1b1220;
                border: none;
                cursor: pointer;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform .3s ease, box-shadow .3s ease;
                box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
                flex-shrink: 0;
            }

            .vinyl-label {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: radial-gradient(circle, #7a1f2b 30%, #54101a 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2;
                border: 2px solid #8a2f4d;
            }

            .vinyl-label svg {
                width: 12px;
                height: 12px;
                fill: #fff;
            }

            .play-btn .pause-icon {
                display: none;
            }

            .play-btn.playing {
                animation: spin 3s linear infinite;
                box-shadow: 0 10px 40px rgba(232, 129, 154, .55);
            }

            .play-btn.playing .play-icon {
                display: none;
            }

            .play-btn.playing .pause-icon {
                display: block;
            }

            @keyframes spin {
                from { transform: rotate(0deg); }
                to   { transform: rotate(360deg); }
            }

            .mikee {
                position: fixed;
                bottom: 16px;
                left: 0;
                right: 0;
                text-align: center;
                font-family: inherit;
                font-style: normal;
                font-size: 1rem;
                color: rgba(82, 35, 92, .45);
                z-index: 50;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="title">for you, love</p>
            <p class="sub">A Lilac Bouquet</p>
            <a href="#" onclick="shakeBouquet(event)">
                <img class="bouquet-img" src="lilac-cutout.png" alt="A bouquet for you">
            </a>
            <p class="note">
                A lilac stands for love and purity. I know my love for you is pure, and I'll give you the purest love every day. I will protect you and take care of you.
            </p>
            <a class="back" href="surprise.html#bouquetSection" onclick="sessionStorage.setItem('loveUnlocked','1')">back</a>
        </main>

        <footer class="mikee">- Mikee</footer>

        <div class="music-player" id="musicPlayer">
            <button class="play-btn" id="playBtn" onclick="__songToggle()">
                <div class="vinyl-label">
                    <svg class="play-icon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
                </div>
            </button>
            <p class="playing-text" id="playingText">play this song</p>
        </div>

        <audio id="bgMusic" loop>
            <source src="Libu-Libong Buwan (Uuwian) - Kyle Raphael (Lyric Video).mp3" type="audio/mpeg">
        </audio>

        <script>
            (function () {
                var STORE = "gg_nothing_song";
                var audio = document.getElementById("bgMusic");
                var btn = document.getElementById("playBtn");
                var player = document.getElementById("musicPlayer");
                var txt = document.getElementById("playingText");

                function save() {
                    try {
                        sessionStorage.setItem(STORE, JSON.stringify({ playing: !audio.paused, time: audio.currentTime || 0 }));
                    } catch (e) {}
                }

                function load() {
                    try { return JSON.parse(sessionStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
                }

                function setUI(playing) {
                    btn.classList.toggle("playing", playing);
                    if (player) player.classList.toggle("playing", playing);
                    txt.textContent = playing ? "playing" : "play this song";
                }

                window.__songToggle = function () {
                    if (!audio) return;
                    if (audio.paused) {
                        var p = audio.play();
                        if (p && p.catch) p.catch(function () {});
                        setUI(true);
                    } else {
                        audio.pause();
                        setUI(false);
                    }
                    save();
                };

(function init() {
                    var st = load();
                    var startAt = 74;
                    var t = st.time;
                    if (!(t && Number(t) > 0 && isFinite(t))) {
                        t = startAt;
                    }
                    audio.currentTime = Number(t);
                    setInterval(save, 1000);
                    window.addEventListener("pagehide", save);
                    if (st.playing) {
                        var p = audio.play();
                        if (p && p.catch) p.catch(function () { setUI(false); });
                        setUI(true);
                    } else {
                        setUI(false);
                    }
                })();
            })();
        </script>

        <script>
            function shakeBouquet(e) {
                e.preventDefault();
                const img = document.querySelector(".bouquet-img");
                const note = document.querySelector(".note");
                note.textContent = "Kulang pa 'to - ikaw lang ang totoong bouquet ko. Happy 17th Monthsary, love!";
                img.style.animation = "none";
                void img.offsetWidth;
                img.style.animation = "popIn .6s cubic-bezier(.22, 1.61, .36, 1) both";
                note.style.transform = "scale(1.05)";
                setTimeout(function () { note.style.transform = ""; }, 300);
            }
        </script>
    </body>
</html>
