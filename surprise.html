<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Surprise</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Quicksand:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Quicksand", Georgia, serif;
                color: #fff;
                text-align: center;
                background: linear-gradient(160deg, #7a1f2b 0%, #54101a 55%, #33060d 100%);
                min-height: 100vh;
                padding: 40px 20px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .blush-bg {
                position: fixed;
                inset: 0;
                background: linear-gradient(160deg, #7a1f2b 0%, #54101a 50%, #33060d 100%);
                opacity: 0;
                transition: opacity 1.2s ease;
                pointer-events: none;
                z-index: 0;
            }

            body.unlocked .blush-bg {
                opacity: 1;
            }

            .phone {
                width: min(350px, 90vw);
                height: auto;
                max-height: 92vh;
                background: #ffffff;
                border-radius: 46px;
                border: 8px solid #15151a;
                box-shadow: 0 30px 60px rgba(20, 5, 30, .45), inset 0 0 0 2px rgba(255,255,255,.12);
                position: relative;
                overflow: hidden;
            }

            .phone::before {
                content: "";
                position: absolute;
                left: 50%;
                top: 12px;
                transform: translateX(-50%);
                width: 110px;
                height: 26px;
                background: #15151a;
                border-radius: 16px;
                z-index: 10;
            }

            

            .status-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 26px 8px;
                font-size: .8rem;
                font-weight: 600;
                color: #fff;
            }

            .status-icons {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: .72rem;
            }

            .screen {
                padding: 22px 22px 20px;
                overflow-y: auto;
            }

            

            .lock-screen {
                width: 100%;
                text-align: center;
                padding-top: 18px;
                transition: transform .3s ease;
            }

            h2 {
                font-family: "Poppins", sans-serif;
                font-weight: 500;
                color: #000;
                margin-bottom: 6px;
                font-size: 1.1rem;
                letter-spacing: .5px;
            }

.hint-note {
                font-family: inherit;
                font-weight: 400;
                font-size: .95rem;
                color: #fff;
                margin-bottom: 22px;
            }

            .monthsary-date {
                font-family: "Poppins", sans-serif;
                font-weight: 600;
                font-size: .85rem;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                color: #e63946;
                margin: 0 0 8px;
            }

            .phone-lock-icon {
                font-size: 2.4rem;
                color: #fff;
                margin-bottom: 12px;
            }

            .pass-dots {
                display: flex;
                justify-content: center;
                gap: 14px;
                margin: 6px 0 22px;
            }

.pass-dots span {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                border: 2px solid #e63946;
                background: transparent;
                transition: background .15s ease, transform .15s ease;
            }

.pass-dots span.filled {
                background: #e63946;
                border-color: #e63946;
                transform: scale(1.15);
            }

            .lock-screen.shake {
                animation: shake .5s ease;
            }

            @keyframes shake {
                0%, 20%, 40%, 60%, 80%, 100% { transform: translateX(0); }
                10%  { transform: translateX(-12px); }
                30%  { transform: translateX(12px); }
                50%  { transform: translateX(-8px); }
                70%  { transform: translateX(8px); }
                90%  { transform: translateX(-4px); }
            }

            .keypad {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                justify-items: center;
            }

.key {
                width: 64px;
                height: 64px;
                border-radius: 50%;
                border: 2px solid rgba(230, 57, 70, .45);
                background: rgba(230, 57, 70, .06);
                color: #e63946;
                font-family: "Poppins", sans-serif;
                font-size: 1.4rem;
                font-weight: 500;
                line-height: 1;
                font-variant-numeric: tabular-nums;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: background .15s ease, transform .1s ease;
            }

            .key:hover {
                background: rgba(230, 57, 70, .14);
            }

            .key:active {
                transform: scale(.92);
                background: rgba(230, 57, 70, .26);
            }

            .key.space {
                border: none;
                background: transparent;
                cursor: default;
                pointer-events: none;
            }

.key-del {
                color: #e63946;
            }

            .key svg {
                width: 20px;
                height: 20px;
                display: block;
            }

            .content {
                display: none;
                width: 100%;
                max-width: 560px;
                padding: 16px 10px 20px;
                position: relative;
                z-index: 1;
            }

            .content.revealed {
                display: block;
                animation: fadeIn .6s ease;
            }

            @keyframes fadeIn {
                from { opacity: 0; }
                to   { opacity: 1; }
            }

.content::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: none;
            }

            .music-player {
                position: fixed;
                right: 20px;
                bottom: 24px;
                z-index: 60;
                display: flex;
                align-items: center;
                gap: 12px;
                background: rgba(255, 250, 252, .85);
                border-radius: 40px;
                padding: 8px 16px 8px 8px;
                box-shadow: 0 10px 26px rgba(192, 90, 124, .35);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
            }

            .scroll-hint {
                position: fixed;
                bottom: 80px;
                left: 0;
                right: 0;
                text-align: center;
                font-family: "Poppins", sans-serif;
                font-size: .78rem;
                font-weight: 500;
                letter-spacing: 3px;
                text-transform: uppercase;
color: rgba(192, 90, 124, .55);
                z-index: 5;
                animation: hintPulse 1.8s ease-in-out infinite;
            }

            @keyframes hintPulse {
                0%, 100% { transform: translateY(0); }
                50%      { transform: translateY(-6px); }
            }

.letter-section {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                margin-top: 26px;
                position: relative;
                z-index: 1;
            }

            .letter-title {
                font-family: "Poppins", sans-serif;
                font-weight: 500;
                font-size: clamp(1.9rem, 5.5vw, 3rem);
                letter-spacing: 2px;
                text-transform: uppercase;
                color: #fff;
                text-shadow: 0 1px 6px rgba(255, 255, 255, .7);
            }

            .letter-title .word {
                display: inline-block;
                opacity: 0;
                transform: translateY(24px) scale(.9);
            }

            .letter-title.in-view .word {
                animation: wordIn .4s ease forwards;
            }

            .letter-title.in-view .word:nth-child(1) { animation-delay: .1s; }
            .letter-title.in-view .word:nth-child(2) { animation-delay: .25s; }
            .letter-title.in-view .word:nth-child(3) { animation-delay: .4s; }
            .letter-title.in-view .word:nth-child(4) { animation-delay: .55s; }

            .letter-frame {
                padding: 0;
                background: none;
                border: none;
                box-shadow: none;
            }

.letter-frame img {
                display: block;
                width: min(1200px, 96vw);
                height: auto;
                max-height: 72vh;
                object-fit: contain;
                border-radius: 8px;
                user-select: none;
            }

.scroll-hint.inline {
                position: static;
                margin-top: 28px;
            }

            .scroll-hint.below {
                position: static;
                margin-top: 30px;
            }

.choose-one {
                font-family: "Poppins", sans-serif;
                font-weight: 500;
                font-size: clamp(1.9rem, 5.5vw, 3rem);
                letter-spacing: 2px;
                text-transform: uppercase;
                color: #fff;
                text-shadow: 0 1px 6px rgba(255, 255, 255, .7);
                opacity: 0;
                transform: translateY(24px) scale(.9);
            }

.heart-section {
                min-height: 70vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 26px;
                padding: 5vh 0;
                position: relative;
                z-index: 1;
            }

            .heart-row {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 40px;
                opacity: 0;
                transform: translateY(24px) scale(.9);
            }

            .heart-section.in-view .choose-one {
                animation: wordIn .4s ease forwards 1.2s;
            }

            .heart-section.in-view .heart-row {
                animation: wordIn .4s ease forwards 1.5s;
            }

            .heart-btn {
                background: none;
                border: none;
                cursor: pointer;
                padding: 4px;
                filter: drop-shadow(0 8px 16px rgba(232, 129, 154, .55));
                transition: transform .25s ease;
            }

            .heart-btn img {
                display: block;
                width: clamp(150px, 24vw, 220px);
                height: auto;
                user-select: none;
            }

            .heart-btn:hover {
                transform: scale(1.15);
            }

            .heart-btn:active {
                transform: scale(.88);
            }

.bouquet-section {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                gap: 34px;
                min-height: 100vh;
                padding-top: 15vh;
                position: relative;
                z-index: 1;
            }

            .bouquet-title {
                font-family: "Great Vibes", Georgia, serif;
                font-weight: 400;
                font-size: clamp(1.4rem, 5vw, 2.2rem);
                letter-spacing: 1px;
                color: #fff;
                text-shadow: 0 1px 6px rgba(255, 255, 255, .7);
                line-height: 1.5;
                white-space: nowrap;
            }

            .bouquet-title .word {
                display: inline-block;
                opacity: 0;
                transform: translateY(24px) scale(.9);
                animation: wordIn .4s ease forwards;
            }

            .bouquet-title .word:nth-child(1) { animation-delay: .1s; }
            .bouquet-title .word:nth-child(2) { animation-delay: .25s; }
            .bouquet-title .word:nth-child(3) { animation-delay: .4s; }
            .bouquet-title .word:nth-child(4) { animation-delay: .55s; }
            .bouquet-title .word:nth-child(5) { animation-delay: .7s; }
            .bouquet-title .word:nth-child(6) { animation-delay: .85s; }
            .bouquet-title .word:nth-child(7) { animation-delay: 1s; }
            .bouquet-title .word:nth-child(8) { animation-delay: 1.15s; }

            @keyframes wordIn {
                to { opacity: 1; transform: translateY(0); }
            }

            .bouquet-frame {
                background: none;
                padding: 0;
                box-shadow: none;
            }

.bouquet-frame img {
                display: block;
                width: min(420px, 88vw);
                height: auto;
                user-select: none;
                animation: popIn .8s cubic-bezier(.22, 1.61, .36, 1) both;
                animation-delay: .2s;
                transition: transform .3s ease;
            }

            .bouquet-hint {
                font-family: "Poppins", sans-serif;
                font-size: .85rem;
                font-weight: 500;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: rgba(192, 90, 124, .75);
                animation: hintPulse 1.8s ease-in-out infinite;
            }

            .bouquet-link {
                display: inline-block;
                cursor: pointer;
            }

            .bouquet-link:hover img {
                transform: scale(1.06);
            }

            .bouquet-link:active img {
                transform: scale(.95);
            }

            @keyframes popIn {
                0% { opacity: 0; transform: scale(.3); }
                70% { transform: scale(1.06); }
                100% { opacity: 1; transform: scale(1); }
            }

            .music-player .play-text {
                display: none;
            }

            .playing-text {
                font-family: "Poppins", sans-serif;
                font-weight: 400;
                font-size: .68rem;
                letter-spacing: 2px;
text-transform: uppercase;
                color: #000;
                white-space: nowrap;
                margin: 0;
            }

            .play-btn {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: #1b1220;
                border: none;
                cursor: pointer;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform .3s ease, box-shadow .3s ease;
                box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
                flex-shrink: 0;
            }

            .play-btn::before {
                content: "";
                position: absolute;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: 1px solid rgba(255, 255, 255, .1);
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            .play-btn:hover {
                transform: scale(1.08);
                box-shadow: 0 8px 20px rgba(0, 0, 0, .5);
            }

            .vinyl-label {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: radial-gradient(circle, #7a1f2b 30%, #54101a 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2;
                border: 2px solid #8a2f4d;
            }

            .vinyl-label svg {
                width: 12px;
                height: 12px;
                fill: #ffffff;
            }

            .play-btn .pause-icon {
                display: none;
            }

            .play-btn.playing {
                animation: spin 3s linear infinite;
                box-shadow: 0 10px 40px rgba(232,129,154,.55);
            }

            .play-btn.playing .play-icon {
                display: none;
            }

            .play-btn.playing .pause-icon {
                display: block;
            }

            @keyframes spin {
                from { transform: rotate(0deg); }
                to   { transform: rotate(360deg); }
            }

            .mikee {
                position: fixed;
                bottom: 16px;
                left: 0;
                right: 0;
                text-align: center;
                font-family: inherit;
                font-style: normal;
                font-size: 1rem;
                color: rgba(82, 35, 92, .45);
                z-index: 50;
                pointer-events: none;
            }

            </style>
    </head>
    <body>
        <div class="blush-bg"></div>

        <div class="phone" id="phone">
            <div class="status-bar">
                <span>04:24</span>
                <span class="status-icons">&#128241; &#128101;</span>
            </div>
            <div class="screen">
                <div class="lock-screen" id="lockScreen">
                    <div class="phone-lock-icon">&#128274;</div>
<h2>Do you want to see the surprise?</h2>
                    <p class="monthsary-date">Enter our Monthsary Date</p>
                    <p class="hint-note">Enter our monthsary to continue</p>
                    <div class="pass-dots" id="passDots">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="keypad">
                        <button class="key" onclick="pressKey('1')">1</button>
                        <button class="key" onclick="pressKey('2')">2</button>
                        <button class="key" onclick="pressKey('3')">3</button>
                        <button class="key" onclick="pressKey('4')">4</button>
                        <button class="key" onclick="pressKey('5')">5</button>
                        <button class="key" onclick="pressKey('6')">6</button>
                        <button class="key" onclick="pressKey('7')">7</button>
                        <button class="key" onclick="pressKey('8')">8</button>
                        <button class="key" onclick="pressKey('9')">9</button>
                        <span class="key space"></span>
                        <button class="key" onclick="pressKey('0')">0</button>
                        <button class="key key-del" onclick="pressDelete()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5 2.5 12 6 19h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H6zm11 12.6-1.4 1.4-2.6-2.6-2.6 2.6L9 17.6l2.6-2.6L9 12.4l1.4-1.4 2.6 2.6 2.6-2.6 1.4 1.4-2.6 2.6 2.6 2.6z"/></svg></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="content" id="content">
<div class="bouquet-section" id="bouquetSection">
                <p class="bouquet-title">
                    <span class="word">Hi</span>
                    <span class="word">love,</span>
                    <span class="word">I</span>
                    <span class="word">made</span>
                    <span class="word">this</span>
                    <span class="word">bouquet</span>
                    <span class="word">for</span>
                    <span class="word">you</span>
                </p>
                <div class="bouquet-frame">
                    <a class="bouquet-link" href="bouquet.html" onclick="sessionStorage.setItem('loveUnlocked','1')">
                        <img src="lilac-cutout.png" alt="A bouquet for you">
                    </a>
                </div>
                <p class="bouquet-hint">click this bouquet</p>
                <p class="scroll-hint below" id="scrollHint">scroll down</p>
            </div>
            <div class="letter-section">
                <p class="letter-title">
                    <span class="word">A</span>
                    <span class="word">LETTER</span>
                    <span class="word">FOR</span>
                    <span class="word">YOU</span>
                </p>
                <div class="letter-frame">
                    <img src="paper3.png" alt="letter paper">
                </div>
                <p class="scroll-hint inline" id="scrollHint2">scroll down</p>
            </div>
            <div class="heart-section" id="heartSection">
                <p class="choose-one">Choose One</p>
                <div class="heart-row" id="heartRow">
                    <button class="heart-btn" onclick="goToSurprise('heart1.html')" title="Surprise 1" aria-label="Surprise 1"><img src="heartt.png" alt=""></button>
                    <button class="heart-btn" onclick="goToSurprise('heart2.html')" title="Surprise 2" aria-label="Surprise 2"><img src="heartt.png" alt=""></button>
                    <button class="heart-btn" onclick="goToSurprise('heart3.html')" title="Surprise 3" aria-label="Surprise 3"><img src="heartt.png" alt=""></button>
                </div>
            </div>
            <div class="music-player" id="musicPlayer">
                <button class="play-btn" id="playBtn" onclick="togglePlay()">
                    <div class="vinyl-label">
                        <svg class="play-icon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
                        <svg class="pause-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
                    </div>
                </button>
                <p class="playing-text" id="playingText">play this song</p>
            </div>
        </div>

        <audio id="bgMusic" loop>
            <source src="Libu-Libong Buwan (Uuwian) - Kyle Raphael (Lyric Video).mp3" type="audio/mpeg">
        </audio>

        <footer class="mikee">- Mikee</footer>

        <script>
            const PASSCODE = "0424";
            let entered = "";

let resumeNext = false;
function goToSurprise(page) {
                sessionStorage.setItem("loveUnlocked", "1");
                try {
                    const audio = document.getElementById("bgMusic");
                    if (page === "heart1.html") {
                        resumeNext = !!(audio && !audio.paused);
                        if (audio) audio.pause();
                        saveSongState();
                    } else {
                        sessionStorage.setItem("gg_nothing_song", JSON.stringify({ playing: false, time: 0 }));
                    }
                } catch (e) {}
                location.href = page;
            }

            function pressKey(digit) {
                const dots = document.querySelectorAll("#passDots span");

                if (entered.length >= 4) return;
                entered += digit;
                dots[entered.length - 1].classList.add("filled");

                if (entered.length === 4) {
                    setTimeout(checkCode, 180);
                }
            }

            function pressDelete() {
                if (entered.length === 0) return;
                const dots = document.querySelectorAll("#passDots span");
                entered = entered.slice(0, -1);
                dots[entered.length].classList.remove("filled");
            }

            function checkCode() {
                const dots = document.querySelectorAll("#passDots span");

if (entered === PASSCODE) {
                    try { sessionStorage.setItem("loveUnlocked", "1"); } catch (e) {}
                    document.getElementById("phone").style.display = "none";
                    document.body.classList.add("unlocked");
                    document.getElementById("content").classList.add("revealed");
                    return;
                }

                const lock = document.getElementById("lockScreen");
                entered = "";
                dots.forEach(d => d.classList.remove("filled"));
                lock.classList.remove("shake");
                void lock.offsetWidth;
                lock.classList.add("shake");
            }

let playingTimer;

            function togglePlay() {
                const audio = document.getElementById("bgMusic");
                const btn = document.getElementById("playBtn");
                const player = document.getElementById("musicPlayer");
                const txt = document.getElementById("playingText");

                if (audio.paused) {
                    audio.play();
                    btn.classList.add("playing");
                    player.classList.add("playing");
                    clearTimeout(playingTimer);
                    txt.textContent = "playing";
                } else {
                    audio.pause();
                    clearTimeout(playingTimer);
                    btn.classList.remove("playing");
                    player.classList.remove("playing");
                    txt.textContent = "play this song";
                }
                saveSongState();
            }

            function saveSongState() {
                try {
                    const audio = document.getElementById("bgMusic");
                    const st = { playing: !audio.paused, time: audio.currentTime || 0 };
                    if (resumeNext) st.resume = true;
                    sessionStorage.setItem("gg_nothing_song", JSON.stringify(st));
                } catch (e) {}
            }

            (function initSong() {
                const audio = document.getElementById("bgMusic");
                const btn = document.getElementById("playBtn");
                const player = document.getElementById("musicPlayer");
                const txt = document.getElementById("playingText");
                let st = {};
                try { st = JSON.parse(sessionStorage.getItem("gg_nothing_song")) || {}; } catch (e) { st = {}; }
                let startAt = 74;
                let t = st.time;
                if (!(t && Number(t) > 0 && isFinite(t))) {
                    t = startAt;
                }
                audio.currentTime = Number(t);
                setInterval(saveSongState, 1000);
                window.addEventListener("pagehide", saveSongState);
                if (st.playing || st.resume) {
                    const p = audio.play();
                    if (p && p.catch) p.catch(function () {
                        btn.classList.remove("playing");
                        player.classList.remove("playing");
                        txt.textContent = "play this song";
                    });
                    btn.classList.add("playing");
                    player.classList.add("playing");
                    txt.textContent = "playing";
                    if (audio.paused) {
                        let resume = function () {
                            let q = audio.play();
                            if (q && q.catch) q.catch(function () {});
                        };
                        document.addEventListener("click", resume, { once: true });
                        document.addEventListener("touchstart", resume, { once: true });
                        document.addEventListener("keydown", resume, { once: true });
                    }
                }
            })();

            document.addEventListener("keydown", function (e) {
                if (/^[0-9]$/.test(e.key)) pressKey(e.key);
                if (e.key === "Backspace") pressDelete();
            });

            const letterSection = document.querySelector(".letter-section");
            const letterTitle = document.querySelector(".letter-title");
            if (letterTitle && letterSection) {
                const letterObs = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            letterTitle.classList.add("in-view");
                            letterSection.classList.add("in-view");
                            letterObs.disconnect();
                        }
                    });
                }, { threshold: 0.4 });
                letterObs.observe(letterTitle);
            }

            const heartSection = document.querySelector("#heartSection");
            if (heartSection) {
                const heartObs = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            heartSection.classList.add("in-view");
                            heartObs.disconnect();
                        }
                    });
                }, { threshold: 0.4 });
                heartObs.observe(heartSection);
            }

            (function () {
                if (sessionStorage.getItem("loveUnlocked") === "1") {
                    document.getElementById("phone").style.display = "none";
                    document.body.classList.add("unlocked");
                    document.getElementById("content").classList.add("revealed");
if (location.hash === "#heartRow") {
                        setTimeout(function () {
                            document.getElementById("heartRow").scrollIntoView({ behavior: "smooth", block: "center" });
                        }, 120);
                    }
                    if (location.hash === "#bouquetSection") {
                        setTimeout(function () {
                            document.getElementById("bouquetSection").scrollIntoView({ behavior: "smooth", block: "start" });
                        }, 120);
                    }
                }
            })();

window.addEventListener("scroll", function () {
                const hint = document.getElementById("scrollHint");
                if (hint) {
                    const rect = hint.getBoundingClientRect();
                    const center = rect.top + rect.height / 2;
                    const fade = Math.max(0, 1 - Math.abs(center - window.innerHeight * 0.55) / 140);
                    hint.style.opacity = fade;
                    hint.style.pointerEvents = fade > 0 ? "auto" : "none";
                }
                const hint2 = document.getElementById("scrollHint2");
                if (hint2) {
                    const rect = hint2.getBoundingClientRect();
                    const center = rect.top + rect.height / 2;
                    const fade = Math.max(0, 1 - Math.abs(center - window.innerHeight * 0.55) / 140);
                    hint2.style.opacity = fade;
                    hint2.style.pointerEvents = fade > 0 ? "auto" : "none";
                }
            });
        </script>
    </body>
</html>
